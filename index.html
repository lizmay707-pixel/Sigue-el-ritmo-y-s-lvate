<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reto Corporal y Ambiental</title>
<style>
  body { font-family: system-ui, sans-serif; background: #1e272e; color: #f5f6fa; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; text-align: center; padding: 15px; }
  .card { background: #2f3640; border-radius: 20px; padding: 25px; max-width: 560px; width: 100%; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
  .top { display: flex; justify-content: space-between; margin-bottom: 10px; font-weight: bold; }
  .badge { background: #3498db; padding: 5px 14px; border-radius: 15px; }
  .step { background: rgba(255,255,255,0.1); padding: 5px 14px; border-radius: 15px; color: #f1c40f; }
  h1 { color: #2ecc71; font-size: 1.7rem; margin: 10px 0; }
  .stage { height: 210px; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.2); border-radius: 15px; margin: 12px 0; }
  #part-emoji { font-size: 7.5rem; line-height: 1; user-select: none; }
  #avatar { width: 180px; height: 200px; display: none; overflow: visible; }
  #arm-l, #arm-r, #head { transition: transform 0.25s; }
  .jump { animation: jump 0.45s infinite alternate; }
  .spin { animation: spin 0.7s ease; }
  .squat { transform: translateY(25px) scaleY(0.85); }
  @keyframes jump { from { transform: translateY(0); } to { transform: translateY(-20px); } }
  @keyframes spin { from { transform: rotateY(0); } to { transform: rotateY(360deg); } }
  .box { font-size: 1.6rem; font-weight: bold; min-height: 85px; display: flex; flex-direction: column; justify-content: center; background: rgba(0,0,0,0.3); border-radius: 12px; padding: 14px; margin: 12px 0; }
  .hint { font-size: 1rem; color: #f1c40f; font-weight: normal; margin-top: 6px; }
  .btns { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
  button { background: #2ecc71; color: #1e272e; border: none; padding: 13px 22px; font-size: 1.1rem; font-weight: bold; border-radius: 10px; cursor: pointer; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-w { background: #f1c40f; }
  .btn-b { background: #3498db; color: #fff; }
  #qa { background: #192a56; padding: 18px; border-radius: 15px; border: 2px solid #f1c40f; margin-top: 15px; display: none; }
  #ans { color: #2ecc71; font-weight: bold; font-size: 1.15rem; margin-top: 10px; display: none; }
</style>
</head>
<body>
<div class="card">
  <div class="top"><span class="badge" id="r-badge">Ronda 1 de 3</span><span class="step" id="s-count">Parte: 0 / 8</span></div>
  <h1>Escucha, Memoriza y Actúa</h1>
  <div class="stage">
    <div id="part-emoji">🧠</div>
    <svg id="avatar" viewBox="0 0 200 240">
      <rect x="70" y="80" width="60" height="80" rx="15" fill="#3498db"/>
      <g id="head" style="transform-origin:100px 75px"><circle cx="100" cy="45" r="30" fill="#f1c40f"/><circle cx="68" cy="45" r="7" fill="#e67e22"/><circle cx="132" cy="45" r="7" fill="#e67e22"/><circle cx="90" cy="40" r="4" fill="#2c3e50"/><circle cx="110" cy="40" r="4" fill="#2c3e50"/><circle cx="100" cy="48" r="4" fill="#e74c3c"/><path d="M90 58 Q100 65 110 58" stroke="#2c3e50" stroke-width="3" fill="none"/></g>
      <g id="arm-l" style="transform-origin:65px 90px"><rect x="45" y="85" width="20" height="60" rx="10" fill="#f1c40f"/></g>
      <g id="arm-r" style="transform-origin:135px 90px"><rect x="135" y="85" width="20" height="60" rx="10" fill="#f1c40f"/></g>
      <rect x="75" y="160" width="20" height="60" rx="10" fill="#2980b9"/><rect x="105" y="160" width="20" height="60" rx="10" fill="#2980b9"/>
    </svg>
  </div>
  <div class="box" id="box"><span>Presiona iniciar para comenzar</span><span class="hint">La música sonará durante toda la ronda</span></div>
  <div class="btns">
    <button id="b-start" onclick="startRound()">▶️ Iniciar Ronda 1</button>
    <button id="b-next" onclick="nextStep()" style="display:none">➡️ Siguiente Parte</button>
    <button id="b-help" class="btn-w" onclick="showHelp()" style="display:none">🆘 No me acuerdo</button>
  </div>
  <div id="qa">
    <h3 style="color:#f1c40f;margin:0 0 10px">🌍 Pregunta para el último en traer el objeto:</h3>
    <p id="q-txt" style="font-size:1.2rem"></p>
    <button class="btn-b" onclick="document.getElementById('ans').style.display='block'">👁️ Ver Respuesta</button>
    <p id="ans"></p><br>
    <button id="b-round" onclick="nextRound()">Siguiente Ronda ➡️</button>
  </div>
</div>
<script>
const rounds = [
  [{t:"Tocar nariz",e:"👃",p:"nose",m:"nose"},{t:"Tocar oreja izquierda",e:"👂",p:"earLeft",m:"earLeft"},{t:"Tocar hombro derecho",e:"💪",p:"shoulderRight",m:"shoulderRight"},{t:"Saltar",e:"⬆️",p:"jump",m:"jump"},{t:"Tocar cabeza",e:"🙆",p:"head",m:"head"},{t:"Aplaudir",e:"👏",p:"clap",m:"clap"},{t:"Tocar rodilla",e:"🦵",p:"knee",m:"knee"},{t:"Girar",e:"🔄",p:"spin",m:"spin"}],
  [{t:"Tocar boca",e:"👄",p:"mouth",m:"mouth"},{t:"Mover cuello",e:"🦒",p:"neck",m:"neck"},{t:"Levantar brazos",e:"🙌",p:"armsUp",m:"armsUp"},{t:"Agacharse",e:"⬇️",p:"squat",m:"squat"},{t:"Tocar oreja derecha",e:"👂",p:"earRight",m:"earRight"},{t:"Tocar nariz",e:"👃",p:"nose",m:"nose"},{t:"Aplaudir",e:"👏",p:"clap",m:"clap"},{t:"Saltar",e:"⬆️",p:"jump",m:"jump"}],
  [{t:"Tocar oreja izquierda",e:"👂",p:"earLeft",m:"earLeft"},{t:"Levantar brazos",e:"🙌",p:"armsUp",m:"armsUp"},{t:"Tocar rodilla",e:"🦵",p:"knee",m:"knee"},{t:"Saltar",e:"⬆️",p:"jump",m:"jump"},{t:"Tocar boca",e:"👄",p:"mouth",m:"mouth"},{t:"Agacharse",e:"⬇️",p:"squat",m:"squat"},{t:"Aplaudir",e:"👏",p:"clap",m:"clap"},{t:"Tocar nariz",e:"👃",p:"nose",m:"head"}]
];
const objs = [
  "¡Busca algo de color MORADO o NARANJA y muéstralo!",
  "¡Trae un objeto que tenga RUEDAS o que sirva para MEDIR!",
  "¡Busca algo que empiece por la letra C y sea REUTILIZABLE!"
];
const qs = [
  {q:"¿De qué color es la caneca para residuos aprovechables como plástico, cartón y vidrio limpios?",a:"Color BLANCO."},
  {q:"¿Qué significa la regla de las 3R en el cuidado del medio ambiente?",a:"Reducir, Reutilizar y Reciclar."},
  {q:"¿En qué caneca se depositan las cáscaras de frutas y restos de comida?",a:"En la caneca de color VERDE (residuos orgánicos)."}
];
// Rangos de tiempo distintos por ronda antes de parar la música (en milisegundos)
const musicStops = [
  () => Math.floor(Math.random() * 2000) + 2000, // Ronda 1: 2 a 4 seg (rápido)
  () => Math.floor(Math.random() * 3000) + 4500, // Ronda 2: 4.5 a 7.5 seg (medio)
  () => Math.floor(Math.random() * 4000) + 6500  // Ronda 3: 6.5 a 10.5 seg (largo)
];
let rIdx = 0, sIdx = -1, mInt = null, ctx = null;
const sleep = ms => new Promise(r => setTimeout(r, ms));
function startMusic() {
  if (ctx) return;
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  const n = [130.8,164.8,196,164.8,146.8,174.6,220,196]; let i = 0;
  mInt = setInterval(() => {
    if (!ctx) return;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'triangle'; o.frequency.setValueAtTime(n[i++ % n.length], ctx.currentTime);
    g.gain.setValueAtTime(0.11, ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.28);
    o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime + 0.28);
  }, 320);
}
function stopMusic() { if (mInt) { clearInterval(mInt); mInt = null; } if (ctx) { ctx.close(); ctx = null; } }
function speak(txt) {
  return new Promise(res => {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(txt); u.lang = 'es-ES'; u.rate = 1.05; u.onend = res;
    window.speechSynthesis.speak(u);
  });
}
function showEmoji(em) {
  document.getElementById('avatar').style.display = 'none';
  const el = document.getElementById('part-emoji'); el.style.display = 'block'; el.innerText = em;
}
function showBot(pose) {
  document.getElementById('part-emoji').style.display = 'none';
  const av = document.getElementById('avatar'), al = document.getElementById('arm-l'), ar = document.getElementById('arm-r'), hd = document.getElementById('head');
  av.style.display = 'block'; av.className = ''; al.style.transform = ar.style.transform = hd.style.transform = 'rotate(0deg)';
  if (pose==='nose'||pose==='mouth') ar.style.transform = 'rotate(135deg)';
  else if (pose==='earLeft') al.style.transform = 'rotate(-145deg)';
  else if (pose==='earRight') ar.style.transform = 'rotate(145deg)';
  else if (pose==='head') { al.style.transform = 'rotate(-160deg)'; ar.style.transform = 'rotate(160deg)'; }
  else if (pose==='shoulderRight') al.style.transform = 'rotate(-90deg)';
  else if (pose==='armsUp') { al.style.transform = 'rotate(-170deg)'; ar.style.transform = 'rotate(170deg)'; }
  else if (pose==='clap') { al.style.transform = 'rotate(-70deg)'; ar.style.transform = 'rotate(70deg)'; }
  else if (pose==='knee') { al.style.transform = 'rotate(-30deg)'; ar.style.transform = 'rotate(30deg)'; av.classList.add('squat'); }
  else if (pose==='squat') av.classList.add('squat');
  else if (pose==='jump') av.classList.add('jump');
  else if (pose==='spin') av.classList.add('spin');
  else if (pose==='neck') hd.style.transform = 'rotate(20deg)';
}
function setBtns(on) { document.getElementById('b-next').disabled = document.getElementById('b-help').disabled = !on; }
function startRound() {
  document.getElementById('b-start').style.display = 'none';
  document.getElementById('b-next').style.display = document.getElementById('b-help').style.display = 'inline-block';
  sIdx = -1; startMusic(); nextStep();
}
async function nextStep() {
  sIdx++; const seq = rounds[rIdx], box = document.getElementById('box'), cnt = document.getElementById('s-count');
  if (sIdx < seq.length) {
    setBtns(false); const act = seq[sIdx], num = sIdx + 1;
    cnt.innerText = 'Parte: ' + num + ' / 8';
    showEmoji(act.e);
    if (num === 1) {
      box.innerHTML = '<span>' + act.t + '</span><span class="hint">¡Ahora hazlo tú!</span>';
    if (num === 1) {
      box.innerHTML = '<span>' + act.t + '</span><span class="hint">¡Ahora hazlo tú!</span>';
      await speak(act.t + ". Ahora hazlo tú.");
    } else {
      box.innerHTML = '<span>' + act.t + '</span><span class="hint">Repite las ' + num + ' partes acumuladas de memoria</span>';
      await speak(act.t);
    }
    document.getElementById('b-next').innerText = num === 8 ? "🤖 Repaso Final con el Muñeco" : "➡️ Siguiente Parte";
    setBtns(true);
  } else {
    document.getElementById('b-next').style.display = document.getElementById('b-help').style.display = 'none';
    cnt.innerText = "¡Ronda Completa!";
    showBot('jump');
    if (rIdx === 2) {
      box.innerHTML = '<span>⚠️ ¡ATENCIÓN AL MUÑECO! ⚠️</span><span class="hint">No mires lo que hace, ¡ESCUCHA lo que dice!</span>';
      await speak("Atención al muñeco. No mires lo que hace, escucha lo que dice.");
    } else {
      box.innerHTML = '<span>🤖 ¡Repaso final con el muñeco!</span><span class="hint">Sigue el ritmo...</span>';
      await speak("Excelente. Ahora hazlo junto al muñeco.");
    }
    await sleep(500);
    for (let i = 0; i < seq.length; i++) {
      box.innerHTML = '<span>' + (i + 1) + '. ' + seq[i].t + '</span>';
      showBot(seq[i].m); await speak(seq[i].t); await sleep(350);
    }
    showBot('jump');
    box.innerHTML = '<span>🎵 ... 🎵</span><span class="hint">¡Atentos a la música!</span>';
    await sleep(musicStops[rIdx]());
    stopMusic();
    showEmoji("🛑");
    box.innerHTML = '<span style="color:#e74c3c">¡SE PARÓ LA MÚSICA!</span><span class="hint" style="font-size:1.3rem">' + objs[rIdx] + '</span>';
    await speak("¡Alto! " + objs[rIdx]);
    document.getElementById('q-txt').innerText = qs[rIdx].q;
    document.getElementById('ans').innerText = "✅ Respuesta: " + qs[rIdx].a;
    document.getElementById('ans').style.display = 'none';
    if (rIdx === 2) document.getElementById('b-round').innerText = "Finalizar Juego 🏆";
    document.getElementById('qa').style.display = 'block';
  }
}
async function showHelp() {
  setBtns(false); const seq = rounds[rIdx], box = document.getElementById('box');
  box.innerHTML = '<span>🤖 ¡Yo te recuerdo el orden!</span><span class="hint">Mira y escucha...</span>';
  showBot('jump'); await speak("Mira y escucha el orden hasta el momento:");
  for (let i = 0; i <= sIdx; i++) {
    box.innerHTML = '<span>' + (i + 1) + '. ' + seq[i].t + '</span><span class="hint">Recordando...</span>';
    showBot(seq[i].p); await speak(seq[i].t); await sleep(300);
  }
  showEmoji(seq[sIdx].e);
  box.innerHTML = '<span>' + seq[sIdx].t + '</span><span class="hint">Repite las ' + (sIdx + 1) + ' partes acumuladas de memoria</span>';
  setBtns(true);
}
function nextRound() {
  document.getElementById('qa').style.display = 'none'; rIdx++;
  if (rIdx < 3) {
    showEmoji("🧠");
    document.getElementById('r-badge').innerText = 'Ronda ' + (rIdx + 1) + ' de 3';
    document.getElementById('s-count').innerText = 'Parte: 0 / 8';
    document.getElementById('box').innerHTML = '<span>Listos para la Ronda ' + (rIdx + 1) + '</span><span class="hint">Presiona el botón cuando estén preparados</span>';
    const b = document.getElementById('b-start'); b.innerText = '▶️ Iniciar Ronda ' + (rIdx + 1); b.style.display = 'inline-block';
  } else {
    showEmoji("🌍");
    document.getElementById('r-badge').innerText = "¡Juego Terminado!";
    document.getElementById('s-count').innerText = "Completado";
    document.getElementById('box').innerHTML = '<span>🎉 ¡Felicitaciones a todos!</span><span class="hint">Gracias por cuidar el medio ambiente</span>';
    speak("Felicitaciones a todos. Gracias por jugar y cuidar el medio ambiente.");
  }
}
</script>
</body>
</html>
