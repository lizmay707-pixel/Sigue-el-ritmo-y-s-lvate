<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reto Corporal y Ambiental</title>
    <style>
        :root {
            --primary: #2ecc71;
            --secondary: #3498db;
            --warning: #f1c40f;
            --danger: #e74c3c;
            --dark: #1e272e;
            --card: #2f3640;
            --light: #f5f6fa;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--dark);
            color: var(--light);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 15px;
        }
        #game-container {
            background: var(--card);
            border-radius: 20px;
            padding: 25px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .badge {
            background: var(--secondary);
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.95rem;
        }
        .step-counter {
            background: rgba(255,255,255,0.1);
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: bold;
            color: var(--warning);
        }
        h1 { margin: 5px 0 15px 0; color: var(--primary); font-size: 1.8rem; }
        
        #instruction-box {
            font-size: 1.9rem;
            font-weight: bold;
            min-height: 90px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.3);
            border-radius: 15px;
            padding: 15px;
            margin: 15px 0;
            border: 2px solid rgba(255,255,255,0.05);
        }
        .sub-hint {
            font-size: 1rem;
            color: #bdc3c7;
            font-weight: normal;
            margin-top: 6px;
        }

        /* Personaje SVG */
        svg { width: 200px; height: 240px; overflow: visible; }
        #arm-left, #arm-right, #head { transition: transform 0.25s ease; }
        
        .pose-saltar { animation: jump 0.45s infinite alternate; }
        .pose-girar { animation: spin 0.7s ease; }
        .pose-agacharse { transform: translateY(30px) scaleY(0.85); }
        
        @keyframes jump {
            from { transform: translateY(0); }
            to { transform: translateY(-25px); }
        }
        @keyframes spin {
            from { transform: rotateY(0deg); }
            to { transform: rotateY(360deg); }
        }

        button {
            background: var(--primary);
            color: var(--dark);
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            margin: 8px;
            transition: transform 0.15s, background 0.2s;
        }
        button:hover { transform: scale(1.04); }
        .btn-blue { background: var(--secondary); color: white; }
        
        #qa-modal {
            background: #192a56;
            padding: 20px;
            border-radius: 15px;
            border: 2px solid var(--warning);
            margin-top: 15px;
            display: none;
        }
        .answer-text {
            color: var(--primary);
            font-weight: bold;
            font-size: 1.2rem;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div class="header-bar">
        <span class="badge" id="round-badge">Ronda 1 de 3</span>
        <span class="step-counter" id="step-counter">Paso: 0 / 8</span>
    </div>
    <h1>Escucha, Memoriza y Actúa</h1>
    
    <!-- Personaje SVG -->
    <div id="character-stage">
        <svg id="avatar" viewBox="0 0 200 240">
            <!-- Cuerpo -->
            <rect x="70" y="80" width="60" height="80" rx="15" fill="#3498db"/>
            <!-- Cabeza -->
            <g id="head" style="transform-origin: 100px 75px;">
                <circle cx="100" cy="45" r="30" fill="#f1c40f"/>
                <circle cx="68" cy="45" r="7" fill="#e67e22"/>
                <circle cx="132" cy="45" r="7" fill="#e67e22"/>
                <circle cx="90" cy="40" r="4" fill="#2c3e50"/>
                <circle cx="110" cy="40" r="4" fill="#2c3e50"/>
                <circle cx="100" cy="48" r="4" fill="#e74c3c"/>
                <path d="M 90 58 Q 100 65 110 58" stroke="#2c3e50" stroke-width="3" fill="none"/>
            </g>
            <!-- Brazos -->
            <g id="arm-left" style="transform-origin: 65px 90px;">
                <rect x="45" y="85" width="20" height="60" rx="10" fill="#f1c40f"/>
            </g>
            <g id="arm-right" style="transform-origin: 135px 90px;">
                <rect x="135" y="85" width="20" height="60" rx="10" fill="#f1c40f"/>
            </g>
            <!-- Piernas -->
            <g id="legs">
                <rect x="75" y="160" width="20" height="60" rx="10" fill="#2980b9"/>
                <rect x="105" y="160" width="20" height="60" rx="10" fill="#2980b9"/>
            </g>
        </svg>
    </div>

    <div id="instruction-box">
        <span>Presiona iniciar para comenzar</span>
        <span class="sub-hint">La música sonará durante toda la ronda</span>
    </div>

    <div id="controls">
        <button id="btn-start" onclick="startRound()">▶️ Iniciar Ronda 1</button>
    </div>

    <!-- Modal de Pregunta Ambiental -->
    <div id="qa-modal">
        <h3 style="color: var(--warning); margin-top:0;">🌍 Pregunta para el último en traer el objeto:</h3>
        <p id="env-question" style="font-size: 1.25rem;"></p>
        <button class="btn-blue" onclick="document.getElementById('env-answer').style.display='block'">👁️ Mostrar Respuesta</button>
        <p id="env-answer" class="answer-text"></p>
        <br>
        <button id="btn-next-round" onclick="nextRound()">Siguiente Ronda ➡️</button>
    </div>
</div>

<script>
    // --- BANCO DE RONDAS (8 pasos directos por ronda) ---
    // En Rondas 1 y 2 el muñeco hace exactamente lo que dice.
    // En Ronda 3 el muñeco hace movimientos diferentes (TRAMPA).
    const rounds = [
        // RONDA 1: Sincronizada
        [
            { text: "👃 Tocar nariz", speak: "Tocar nariz", pose: "nose" },
            { text: "👂 Tocar oreja izquierda", speak: "Tocar oreja izquierda", pose: "earLeft" },
            { text: "💪 Tocar hombro derecho", speak: "Tocar hombro derecho", pose: "shoulderRight" },
            { text: "⬆️ Saltar", speak: "Saltar", pose: "jump" },
            { text: "🙆 Tocar cabeza", speak: "Tocar cabeza", pose: "head" },
            { text: "👏 Aplaudir", speak: "Aplaudir", pose: "clap" },
            { text: "🦵 Tocar rodilla", speak: "Tocar rodilla", pose: "knee" },
            { text: "🔄 Girar", speak: "Girar", pose: "spin" }
        ],
        // RONDA 2: Sincronizada
        [
            { text: "👄 Tocar boca", speak: "Tocar boca", pose: "mouth" },
            { text: "🦒 Mover cuello", speak: "Mover cuello", pose: "neck" },
            { text: "🙌 Levantar brazos", speak: "Levantar brazos", pose: "armsUp" },
            { text: "⬇️ Agacharse", speak: "Agacharse", pose: "squat" },
            { text: "👂 Tocar oreja derecha", speak: "Tocar oreja derecha", pose: "earRight" },
            { text: "👃 Tocar nariz", speak: "Tocar nariz", pose: "nose" },
            { text: "👏 Aplaudir", speak: "Aplaudir", pose: "clap" },
            { text: "⬆️ Saltar", speak: "Saltar", pose: "jump" }
        ],
        // RONDA 3: ¡LA TRAMPA! (Dice una cosa, pero su cuerpo hace otra)
        [
            { text: "👃 Tocar nariz", speak: "Tocar nariz", pose: "earLeft" },
            { text: "🙌 Levantar brazos", speak: "Levantar brazos", pose: "squat" },
            { text: "👂 Tocar oreja derecha", speak: "Tocar oreja derecha", pose: "nose" },
            { text: "⬆️ Saltar", speak: "Saltar", pose: "clap" },
            { text: "🙆 Tocar cabeza", speak: "Tocar cabeza", pose: "knee" },
            { text: "👄 Tocar boca", speak: "Tocar boca", pose: "armsUp" },
            { text: "⬇️ Agacharse", speak: "Agacharse", pose: "jump" },
            { text: "👏 Aplaudir", speak: "Aplaudir", pose: "head" }
        ]
    ];

    const searchChallenges = [
        "¡Busca algo de color VERDE y muéstralo!",
        "¡Corre y trae un ZAPATO o tenis!",
        "¡Trae una BOTELLA o vaso reutilizable!"
    ];

    const envQuestions = [
        {
            q: "¿De qué color es la caneca donde van los residuos aprovechables como plástico, cartón y vidrio limpios?",
            a: "Color BLANCO."
        },
        {
            q: "¿Qué significa la regla de las 3R en el cuidado del medio ambiente?",
            a: "Reducir, Reutilizar y Reciclar."
        },
        {
            q: "¿En qué caneca se deben depositar las cáscaras de frutas y restos de comida?",
            a: "En la caneca de color VERDE (residuos orgánicos)."
        }
    ];

    let currentRound = 0;
    let musicInterval = null;
    let audioCtx = null;

    // --- MÚSICA CONTINUA DE FONDO ---
    function startMusic() {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const bassNotes = [130.81, 164.81, 196.00, 164.81, 146.83, 174.61, 220.00, 196.00];
        let step = 0;

        musicInterval = setInterval(() => {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
const gain = audioCtx.createGain();
osc.type = 'triangle';
osc.frequency.setValueAtTime(bassNotes[step % bassNotes.length], audioCtx.currentTime);
// Volumen suave para que no tape la voz
gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.28);
osc.connect(gain);
gain.connect(audioCtx.destination);
osc.start();
osc.stop(audioCtx.currentTime + 0.28);
step++;
}, 320);
}
function stopMusic() {
if (musicInterval) {
clearInterval(musicInterval);
musicInterval = null;
}
if (audioCtx) {
audioCtx.close();
audioCtx = null;
}
}
// --- VOZ ---
function speak(text) {
return new Promise(resolve => {
window.speechSynthesis.cancel();
const utterance = new SpeechSynthesisUtterance(text);
utterance.lang = 'es-ES';
utterance.rate = 1.0;
utterance.onend = resolve;
window.speechSynthesis.speak(utterance);
});
}
// --- POSES DEL MUÑECO ---
function resetPose() {
document.getElementById('avatar').className = '';
document.getElementById('arm-left').style.transform = 'rotate(0deg)';
document.getElementById('arm-right').style.transform = 'rotate(0deg)';
document.getElementById('head').style.transform = 'rotate(0deg)';
}
function applyPose(pose) {
resetPose();
const avatar = document.getElementById('avatar');
const armL = document.getElementById('arm-left');
const armR = document.getElementById('arm-right');
const head = document.getElementById('head');
switch(pose) {
case 'nose':
case 'mouth':
armR.style.transform = 'rotate(135deg)';
break;
case 'earLeft':
armL.style.transform = 'rotate(-145deg)';
break;
case 'earRight':
armR.style.transform = 'rotate(145deg)';
break;
case 'head':
armL.style.transform = 'rotate(-160deg)';
armR.style.transform = 'rotate(160deg)';
break;
case 'shoulderRight':
armL.style.transform = 'rotate(-90deg)';
break;
case 'armsUp':
armL.style.transform = 'rotate(-170deg)';
armR.style.transform = 'rotate(170deg)';
break;
case 'clap':
armL.style.transform = 'rotate(-70deg)';
armR.style.transform = 'rotate(70deg)';
break;
case 'knee':
armL.style.transform = 'rotate(-30deg)';
armR.style.transform = 'rotate(30deg)';
avatar.classList.add('pose-agacharse');
break;
case 'squat':
avatar.classList.add('pose-agacharse');
break;
case 'jump':
avatar.classList.add('pose-saltar');
break;
case 'spin':
avatar.classList.add('pose-girar');
break;
case 'neck':
head.style.transform = 'rotate(20deg)';
break;
}
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
// --- FLUJO DE LA RONDA ---
async function startRound() {
document.getElementById('btn-start').style.display = 'none';
const sequence = rounds[currentRound];
const box = document.getElementById('instruction-box');
const counter = document.getElementById('step-counter');
// Inicia la música para toda la ronda
startMusic();
if (currentRound === 2) {
box.innerHTML = <span>⚠️ ¡RONDA DE TRAMPA! ⚠️</span><span class="sub-hint">No mires al muñeco, solo ESCUCHA y lee</span>;
await speak("Atención. Ronda final. No mires lo que hace el muñeco, solo escucha lo que dice.");
await sleep(1200);
}
// Recorre las 8 partes una por una sin repetir desde el principio
for (let i = 0; i < sequence.length; i++) {
const action = sequence[i];
counter.innerText = Paso: ${i + 1} / 8;
box.innerHTML = <span>${action.text}</span><span class="sub-hint">¡Hazlo y memorízalo!</span>;
applyPose(action.pose);
await speak(action.speak);
// Tiempo para que los jugadores ejecuten el movimiento
await sleep(1600);
resetPose();
await sleep(400);
}
// Momento de memoria y baile antes de que pare la música
counter.innerText = "¡8 / 8 Completados!";
box.innerHTML = <span>🧠 ¡Repite los 8 pasos de memoria!</span><span class="sub-hint">Sigue moviéndote al ritmo de la música...</span>;
applyPose('jump');
await speak("Ahora repite los ocho pasos de memoria mientras sigue la música.");
// Espera aleatoria entre 6 y 10 segundos para que hagan la secuencia y bailen
const extraMusicTime = Math.floor(Math.random() * 4000) + 6000;
await sleep(extraMusicTime);
// ¡SE DETIENE LA MÚSICA DE GOLPE!
stopMusic();
resetPose();
const challenge = searchChallenges[currentRound];
box.innerHTML = <span style="color: var(--danger);">🛑 ¡SE PARÓ LA MÚSICA!</span><span style="color: var(--warning); font-size: 1.5rem; margin-top:8px;">${challenge}</span>;
await speak("¡Alto! " + challenge);
// Mostrar la pregunta ambiental para el último que llegue
const qaModal = document.getElementById('qa-modal');
const qData = envQuestions[currentRound];
document.getElementById('env-question').innerText = qData.q;
document.getElementById('env-answer').innerText = "✅ Respuesta: " + qData.a;
document.getElementById('env-answer').style.display = 'none';
if (currentRound === 2) {
document.getElementById('btn-next-round').innerText = "Finalizar Juego 🏆";
}
qaModal.style.display = 'block';
}
function nextRound() {
document.getElementById('qa-modal').style.display = 'none';
currentRound++;
if (currentRound < 3) {
document.getElementById('round-badge').innerText = Ronda ${currentRound + 1} de 3;
document.getElementById('step-counter').innerText = Paso: 0 / 8;
document.getElementById('instruction-box').innerHTML = <span>Listos para la Ronda ${currentRound + 1}</span><span class="sub-hint">Presiona el botón cuando estén preparados</span>;
const btnStart = document.getElementById('btn-start');
btnStart.innerText = ▶️ Iniciar Ronda ${currentRound + 1};
btnStart.style.display = 'inline-block';
} else {
document.getElementById('round-badge').innerText = "¡Juego Terminado!";
document.getElementById('step-counter').innerText = "Completado";
document.getElementById('instruction-box').innerHTML = <span>🎉 ¡Felicitaciones a todos! 🌍</span><span class="sub-hint">Gracias por jugar y cuidar el medio ambiente</span>;
speak("Felicitaciones a todos. Gracias por jugar y cuidar el medio ambiente.");
}
}
</script>

</body>
</html>
