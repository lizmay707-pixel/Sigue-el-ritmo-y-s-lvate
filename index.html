<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simón Recicla - Reto Ambiental</title>
<style>
  body { font-family: system-ui, sans-serif; background: #141e27; color: #f5f6fa; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; text-align: center; padding: 15px; }
  .card { background: #203239; border-radius: 22px; padding: 25px; max-width: 520px; width: 100%; box-shadow: 0 12px 30px rgba(0,0,0,0.6); }
  .top { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 10px; }
  .badge { background: #2ecc71; color: #141e27; padding: 6px 14px; border-radius: 15px; }
  .goal { background: rgba(255,255,255,0.1); padding: 6px 14px; border-radius: 15px; color: #f1c40f; }
  h1 { margin: 5px 0; font-size: 1.7rem; color: #2ecc71; }
  #status { font-size: 1.15rem; min-height: 32px; margin: 10px 0 18px; color: #e0ddaa; font-weight: bold; }
  
  /* Tablero de 4 Canecas */
  .board { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; max-width: 360px; margin: 0 auto 20px; }
  .pad { height: 145px; border-radius: 20px; border: 4px solid rgba(255,255,255,0.15); cursor: pointer; display: flex; flex-direction: column; justify-content: center; align-items: center; font-weight: bold; transition: transform 0.1s, filter 0.15s, box-shadow 0.15s; user-select: none; opacity: 0.72; }
  .pad:active:not(.locked) { transform: scale(0.95); }
  .pad.locked { cursor: not-allowed; }
  .pad span { font-size: 2.2rem; margin-bottom: 5px; }
  .pad small { font-size: 0.8rem; opacity: 0.9; }

  .green { background: #27ae60; color: #fff; }
  .white { background: #ecf0f1; color: #2c3e50; }
  .black { background: #2c3e50; color: #fff; border-color: #7f8c8d; }
  .red { background: #c0392b; color: #fff; }

  /* Efecto encendido */
  .pad.lit { opacity: 1; transform: scale(1.05); filter: brightness(1.3); box-shadow: 0 0 25px rgba(255,255,255,0.8); z-index: 2; }

  button.main-btn { background: #2ecc71; color: #141e27; border: none; padding: 14px 28px; font-size: 1.15rem; font-weight: bold; border-radius: 12px; cursor: pointer; margin-top: 5px; }
  button.main-btn:hover { transform: scale(1.03); }

  /* Modal de Penitencia */
  #penalty-box { background: #2c1618; border: 2px solid #e74c3c; border-radius: 16px; padding: 18px; margin-top: 15px; display: none; text-align: left; }
  #penalty-box h3 { color: #ff7675; margin: 0 0 10px; text-align: center; }
  .p-item { background: rgba(0,0,0,0.3); padding: 12px; border-radius: 10px; margin-bottom: 10px; }
  .p-label { font-size: 0.85rem; color: #f1c40f; font-weight: bold; text-transform: uppercase; }
  .p-text { font-size: 1.05rem; margin: 4px 0 0; }
  #ans-box { color: #2ecc71; font-weight: bold; margin-top: 8px; display: none; }
  .btn-sm { background: #3498db; color: white; border: none; padding: 8px 14px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 8px; }
</style>
</head>
<body>
<div class="card">
  <div class="top">
    <span class="badge" id="r-badge">Ronda 1 de 3</span>
    <span class="goal" id="g-badge">Meta: 0 / 8</span>
  </div>
  <h1>♻️ Simón Recicla</h1>
  <div id="status">Presiona Iniciar para ver la secuencia</div>

  <div class="board">
    <div class="pad green locked" id="pad-0" onclick="playerClick(0)"><span>🍃</span>VERDE<small>Orgánicos</small></div>
    <div class="pad white locked" id="pad-1" onclick="playerClick(1)"><span>🧴</span>BLANCO<small>Aprovechables</small></div>
    <div class="pad black locked" id="pad-2" onclick="playerClick(2)"><span>🗑️</span>NEGRO<small>No aprovechables</small></div>
    <div class="pad red locked" id="pad-3" onclick="playerClick(3)"><span>🔋</span>ROJO<small>Peligrosos</small></div>
  </div>

  <button class="main-btn" id="btn-start" onclick="startRound()">▶️ Iniciar Ronda 1</button>

  <!-- Tarjeta de Penitencia Doble -->
  <div id="penalty-box">
    <h3>🚨 ¡Te equivocaste! Cumple la penitencia</h3>
    <div class="p-item">
      <div class="p-label">🏃 1. Reto Corporal</div>
      <div class="p-text" id="body-challenge"></div>
    </div>
    <div class="p-item">
      <div class="p-label">🌍 2. Pregunta Ambiental</div>
      <div class="p-text" id="env-q"></div>
      <button class="btn-sm" onclick="document.getElementById('ans-box').style.display='block'">👁️ Ver Respuesta</button>
      <div id="ans-box"></div>
    </div>
    <div style="text-align:center;">
      <button class="main-btn" onclick="retryRound()">🔄 Ya cumplí, reintentar ronda</button>
    </div>
  </div>
</div>

<script>
const roundGoals = new Array(8, 10, 12);
const roundSpeeds = new Array(650, 500, 380);
const freqs = [261.63, 329.63, 392.00, 523.25]; // Notas musicales Do, Mi, Sol, Do alto

const bodyPenalties = [
  "¡Haz 5 sentadillas manteniendo los brazos estirados al frente!",
  "¡Mantén el equilibrio en un solo pie durante 8 segundos!",
  "¡Toca el suelo con ambas manos y da un salto alto 3 veces!",
  "¡Gira 2 veces sobre tu eje y haz 4 aplausos arriba de la cabeza!",
];

const hardEnvQuestions = [
  { q: "¿Por qué las cajas de pizza engrasadas NO deben ir en la caneca blanca de cartón limpio?", a: "Porque la grasa contamina las fibras de celulosa e impide que la pulpa de papel se pueda reciclar." },
  { q: "¿Aproximadamente cuánto tiempo tarda en degradarse una colilla de cigarrillo en el ambiente?", a: "Entre 10 y 12 años, ya que su filtro está hecho de acetato de celulosa (un plástico)." },
  { q: "¿Qué gas de efecto invernadero produce la basura orgánica cuando se descompone sin oxígeno en un relleno sanitario?", a: "Gas metano (CH4), que retiene hasta 28 veces más calor que el CO2." },
  { q: "¿Qué significa que un plástico sea 'oxodegradable' y por qué muchos países lo han prohibido?", a: "Se fragmenta rápidamente en microplásticos invisibles pero no desaparece ni se biodegrada realmente." }
];

let rIdx = 0;
let sequence = [];
let playerIdx = 0;
let isLocked = true;
let pIdx = 0;
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
const sleep = ms => new Promise(r => setTimeout(r, ms));

function playTone(idx, duration = 250, isError = false) {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = isError ? 'sawtooth' : 'sine';
  osc.frequency.setValueAtTime(isError ? 110 : freqs[idx], audioCtx.currentTime);
  gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration / 1000);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration / 1000);
}

function setPadsLocked(lock) {
  isLocked = lock;
  for (let i = 0; i < 4; i++) {
    document.getElementById('pad-' + i).classList.toggle('locked', lock);
  }
}

async function flashPad(idx, speed) {
  const pad = document.getElementById('pad-' + idx);
  pad.classList.add('lit');
  playTone(idx, speed * 0.8);
  await sleep(speed * 0.75);
  pad.classList.remove('lit');
  await sleep(speed * 0.25);
}

function startRound() {
  document.getElementById('btn-start').style.display = 'none';
  document.getElementById('penalty-box').style.display = 'none';
  sequence = [];
  updateHeader();
  nextTurn();
}

function updateHeader() {
  document.getElementById('r-badge').innerText = `Ronda ${rIdx + 1} de 3`;
  document.getElementById('g-badge').innerText = `Meta: ${sequence.length} / ${roundGoals[rIdx]}`;
}

async function nextTurn() {
  setPadsLocked(true);
  playerIdx = 0;
  
  // Agrega un color nuevo aleatorio (0 a 3)
  const newColor = Math.floor(Math.random() * 4);
  sequence.push(newColor);
  updateHeader();
  
  document.getElementById('status').innerText = "👀 Memoriza el NUEVO color...";
  await sleep(600);

  // Ilumina ÚNICAMENTE el color nuevo, sin repetir los anteriores
  const speed = roundSpeeds[rIdx];
  await flashPad(newColor, speed);

  if (sequence.length === 1) {
    document.getElementById('status').innerText = "👉 ¡Toca el primer color!";
  } else {
    document.getElementById('status').innerText = `🧠 ¡Repite los ${sequence.length} colores en orden desde el inicio!`;
  }
  setPadsLocked(false);
}

async function playerClick(idx) {
  if (isLocked) return;
  
  // Ilumina brevemente al tocar
  const pad = document.getElementById('pad-' + idx);
  pad.classList.add('lit');
  setTimeout(() => pad.classList.remove('lit'), 180);

  // Verifica si acertó
  if (idx === sequence[playerIdx]) {
    playTone(idx, 200);
    playerIdx++;

    // Completó la secuencia actual
    if (playerIdx === sequence.length) {
      setPadsLocked(true);
      // ¿Llegó al límite de la ronda (6, 8 o 10)?
      if (sequence.length === roundGoals[rIdx]) {
        await sleep(400);
        finishRound();
      } else {
        document.getElementById('status').innerText = "✅ ¡Bien! Agregando un color más...";
        await sleep(800);
        nextTurn();
      }
    }
  } else {
    // SE EQUIVOCÓ: Activa penitencia
    setPadsLocked(true);
    playTone(0, 600, true);
    document.getElementById('status').innerText = "❌ ¡Color incorrecto!";
    triggerPenalty();
  }
}

function triggerPenalty() {
  const bChal = bodyPenalties[pIdx % bodyPenalties.length];
  const eQues = hardEnvQuestions[pIdx % hardEnvQuestions.length];
  pIdx++;

  document.getElementById('body-challenge').innerText = bChal;
  document.getElementById('env-q').innerText = eQues.q;
  document.getElementById('ans-box').innerText = "✅ Respuesta: " + eQues.a;
  document.getElementById('ans-box').style.display = 'none';
  document.getElementById('penalty-box').style.display = 'block';
}

function retryRound() {
  document.getElementById('penalty-box').style.display = 'none';
  sequence = [];
  updateHeader();
  nextTurn();
}

function finishRound() {
  rIdx++;
  if (rIdx < 3) {
    document.getElementById('status').innerText = `🎉 ¡Superaste la Ronda ${rIdx}! Prepárate para la siguiente.`;
    const btn = document.getElementById('btn-start');
    btn.innerText = `▶️ Iniciar Ronda ${rIdx + 1} (Meta: ${roundGoals[rIdx]} colores)`;
    btn.style.display = 'inline-block';
  } else {
    document.getElementById('r-badge').innerText = "🏆 ¡Campeón Ambiental!";
    document.getElementById('status').innerText = "🌍 ¡Completaste las 3 rondas de reciclaje y memoria!";
    const btn = document.getElementById('btn-start');
    btn.innerText = "🔄 Volver a Jugar desde Ronda 1";
    btn.style.display = 'inline-block';
    rIdx = 0;
  }
}
</script>
</body>
</html>
